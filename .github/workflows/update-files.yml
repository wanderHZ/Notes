name: Auto Update files.json

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'files.json'   # ⭐ 防止死循环

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚙️ Generate files.json
        run: node scripts/generate-files.js

      - name: 📤 Commit & Push if changed
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
    
        git add files.json   # ⭐ 关键：先 add！
    
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "auto: update files.json"
          git push
        fi
