<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的笔记</title>

<style>
:root {
    --bg-color: #f3f4f6;
    --card-bg: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --primary: #3b82f6;
    --border: #e5e7eb;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: var(--bg-color);
}

/* header */
.hero {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: white;
    padding: 40px;
    text-align: center;
}

/* layout */
.layout {
    display: flex;
    max-width: 1200px;
    margin: 20px auto;
    gap: 20px;
}

/* sidebar */
#sidebar {
    width: 260px;
    background: white;
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    height: 80vh;
    overflow-y: auto;
}

/* tree */
.tree-item {
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 14px;
}

.tree-item:hover {
    background: #f3f4f6;
}

.tree-folder {
    font-weight: 600;
}

.tree-children {
    margin-left: 14px;
    display: none;
}

.tree-item.open > .tree-children {
    display: block;
}

/* content */
.content {
    flex: 1;
}

#gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}

/* card */
.card {
    background: white;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-2px);
    background: #eff6ff;
}

.search {
    margin: 20px auto;
    max-width: 600px;
}

.search input {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: none;
    outline: none;
}

</style>
</head>

<body>

<header class="hero">
    <h1>📚 我的笔记</h1>
</header>

<div class="search">
    <input id="searchInput" placeholder="搜索..." />
</div>

<div class="layout">
    <aside id="sidebar"></aside>

    <div class="content">
        <div id="loading">加载中...</div>
        <div id="gallery"></div>
    </div>
</div>

<script>

const GITHUB_USER = 'wanderHZ';
const GITHUB_REPO = 'Notes';
const pageUrl = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;

let allFiles = [];

/* ===================== 加载数据 ===================== */
fetch('./files.json?v=' + Date.now())
.then(res => res.json())
.then(data => {
    document.getElementById('loading').style.display = 'none';

    allFiles = data.map(path => {
        const parts = path.split('/');
        return {
            rawPath: path,
            fileName: parts.pop().replace('.html',''),
            folder: parts.join('/'),
            search: path.toLowerCase()
        };
    });

    renderGallery(allFiles);
    renderSidebar(allFiles);
});

/* ===================== 右侧卡片 ===================== */
function renderGallery(files) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    files.forEach(f => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = f.fileName;

        card.onclick = () => {
            window.open(pageUrl + f.rawPath);
        };

        gallery.appendChild(card);
    });
}

/* ===================== 构建树 ===================== */
function buildTree(files) {
    const root = {};

    files.forEach(f => {
        const parts = f.rawPath.split('/');
        let cur = root;

        parts.forEach((p, i) => {
            if (!cur[p]) {
                cur[p] = (i === parts.length - 1) ? null : {};
            }
            cur = cur[p];
        });
    });

    return root;
}

/* ===================== 渲染树 ===================== */
function renderTree(tree, container, base='') {
    Object.entries(tree).forEach(([name, val]) => {
        const item = document.createElement('div');
        item.className = 'tree-item';

        if (val === null) {
            item.innerText = '📄 ' + name.replace('.html','');
            item.onclick = () => {
                window.open(pageUrl + base + name);
            };
        } else {
            item.classList.add('tree-folder');
            item.innerText = '📁 ' + name;

            const children = document.createElement('div');
            children.className = 'tree-children';

            renderTree(val, children, base + name + '/');

            item.onclick = (e) => {
                if (e.target === item) {
                    item.classList.toggle('open');
                }
            };

            item.appendChild(children);
        }

        container.appendChild(item);
    });
}

/* ===================== 左侧目录 ===================== */
function renderSidebar(files) {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';

    const tree = buildTree(files);
    renderTree(tree, sidebar);
}

/* ===================== 搜索 ===================== */
document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();

    const filtered = allFiles.filter(f => f.search.includes(q));
    renderGallery(filtered);
});

</script>

</body>
</html>
